name: Build Halo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A1 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Name APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk Halo-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Halo-APK
          path: Halo-*.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Halo build ${{ github.run_number }}
          files: Halo-*.apk
          make_latest: true
