name: Build Kita Fold APK

on:
  push:
    branches: [ main ]
    paths:
      - 'kitafold/**'
      - '.github/workflows/kitafold.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle :kitafold:assembleRelease --stacktrace
      - name: Name APK
        run: cp kitafold/build/outputs/apk/release/kitafold-release.apk KitaFold-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: fold-${{ github.run_number }}
          name: Kita Fold ${{ github.run_number }}
          files: KitaFold-*.apk
          make_latest: false
