name: UI check (emulator)

# Runs Halo on an Android emulator sized like the Fold 5's screens, drives it with real touch
# events (long-press, drag to the edge, + sheet, Settings) and publishes screenshots as a
# pre-release named ui-check-N. Start it from the Actions tab or with `gh workflow run`.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Halo
        run: |
          set -o pipefail
          gradle assembleFoldRelease --stacktrace 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A1 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive Halo on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ui/check.sh

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la ui-out || exit 0
          gh release create "ui-check-${{ github.run_number }}" ui-out/* --prerelease --latest=false \
            --title "UI check ${{ github.run_number }}" --notes "Emulator screenshots from the UI check workflow."
